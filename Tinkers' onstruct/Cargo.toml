[package]
name = "tconstruct-horizon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tinkers' Construct core and development diagnostics for Horizon"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["client-adapter"]
client-adapter = ["dep:horizon-mod-sdk"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Validated fork revision; independent of later edits in the host checkout.
horizon-mod-sdk = { git = "https://github.com/sofia-gros/horizon.git", rev = "88b7bfafc01c7c475548d4379845ff4a9f944dc0", optional = true }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = "warn"
