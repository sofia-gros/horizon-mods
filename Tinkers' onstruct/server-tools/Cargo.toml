[package]
name = "tconstruct-server-tools"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Server-side state inspection for the Horizon TConstruct port"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tconstruct-horizon = { path = "..", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Typed server commands and the experimental item/profile API.
horizon-mod-sdk = { git = "https://github.com/sofia-gros/horizon.git", rev = "1e1864bdb6787cef9d118a9982059f9ec611c160" }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = "warn"
