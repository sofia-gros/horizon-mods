[package]
name = "tconstruct-server-tools"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Server-side state inspection for the Horizon TConstruct port"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tconstruct-horizon = { path = "..", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Verified items-read/items-edit fork preview; experimental API level 5.
horizon-mod-sdk = { git = "https://github.com/sofia-gros/horizon.git", rev = "c0993fa55d0e6d81e384fb35d8a4eda2fb18dbd9" }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = "warn"
