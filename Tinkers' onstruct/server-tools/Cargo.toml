[package]
name = "tconstruct-server-tools"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Server-side state inspection for the Horizon TConstruct port"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tconstruct-horizon = { path = "..", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Experimental synchronous mining callback and item/profile API, level 12.
horizon-mod-sdk = { git = "https://github.com/sofia-gros/horizon.git", rev = "1ab61541b2068c93331c1fea7ccb3b566328266c" }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = "warn"
