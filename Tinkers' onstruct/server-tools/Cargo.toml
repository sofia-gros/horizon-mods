[package]
name = "tconstruct-server-tools"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Server-side state inspection for the Horizon TConstruct port"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tconstruct-horizon = { path = "..", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Experimental synchronous mining callback and item/profile API, level 14.
horizon-mod-sdk = { git = "https://github.com/sofia-gros/horizon.git", rev = "3db2147e398f097749e2f28ebb9374972cde9cdc" }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = "warn"

[dev-dependencies]
# Cross-repository transaction integration tests; not used by the Wasm mod.
horizon-items = { git = "https://github.com/sofia-gros/horizon.git", rev = "81b3be3791171700c8105e5b0b218dfa434a12a1" }
