[package]
name = "tconstruct-server-tools"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Server-side state inspection for the Horizon TConstruct port"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tconstruct-horizon = { path = "..", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Verified server item/profile fork preview; experimental API level 9.
horizon-mod-sdk = { git = "https://github.com/sofia-gros/horizon.git", rev = "50c7c14650c8f05a245f93f81463da095ef9882c" }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = "warn"
