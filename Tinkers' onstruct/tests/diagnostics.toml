[[step]]
expect.commands = ["tconstruct"]

[[step]]
command = "tconstruct stats wood wood wood"
expect.feedback = "Pickaxe: durability=60, mining=2.000, damage=1.000, speed=1.200; diagnostics only"

[[step]]
command = "tconstruct stats flint wood wood"
expect.feedback = "Pickaxe: durability=85, mining=3.500, damage=2.250, speed=1.200; diagnostics only"

[[step]]
command = "tconstruct stats stone wood wood"
expect.error = "unsupported material tconstruct:stone"

[[step]]
reload = true
command = "tconstruct stats flint flint flint"
expect.feedback = "Pickaxe: durability=72, mining=3.500, damage=2.475, speed=1.200; diagnostics only"
