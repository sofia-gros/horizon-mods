[mod]
id = "pluto_items_b2"
version = "0.1.0"
priority = 100
[compatibility]
horizon_revision = "cabe8b5de7d0b45541c923c4a6b3c5cb3e3686c7"
[[module]]
id = "adapter"
file = "crates/horizon-client/src/game.rs"
name = "pluto_item_adapter_b2"
source = "adapter.rs"
[[module]]
id = "placement"
file = "crates/horizon-client/src/game.rs"
name = "pluto_item_placement"
source = "placement.rs"
[[injection]]
id = "use"
target = "horizon_client::game::Game<'_>::use_tool"
kind = "HEAD"
cancellable = true
helper = "use.rs"
bindings = [
 { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
 { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
 { name = "allow_block_actions", ty = "bool", value = "allow_block_actions" },
]
[[injection]]
id = "tooltip"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip"
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
 { name = "stack", ty = "&ItemStack", value = "stack" },
 { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "&mut *lines" },
]

[[state]]
id = "placement-guest-check"
target = "horizon_client_render::chunk_map::ChunkMap"
ty = "std::collections::HashMap<u32,Option<([i32;3],u32)>>"
initial = "::core::default::Default::default()"
[[state.constructor]]
target = "horizon_client_render::chunk_map::<ChunkMap as Default>::default"
selector = "Self"
require = 1

[[injection]]
id = "placement-guest-policy"
target = "horizon_client::game::lan_actions::Game<'_>::enter_guest"
kind = "HEAD"
helper = "guest-placement.rs"
bindings = [
 { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
 { name = "host", ty = "&crate::game::lan::LanHost", value = "&*host" },
 { name = "conn", ty = "u32", value = "conn" },
]

[[injection]]
id = "placement-guest-policy-clear"
target = "horizon_client::game::lan_actions::Game<'_>::leave_guest"
kind = "HEAD"
helper = "guest-placement-clear.rs"
bindings = [
 { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
 { name = "swap", ty = "&crate::game::lan_actions::GuestSwap", value = "&swap" },
]

[[module]]
id = "guest-policy"
file = "crates/horizon-client/src/game.rs"
name = "pluto_guest_policy"
source = "guest-policy.rs"

[[module]]
id = "support-policy"
file = "crates/horizon-client/src/game.rs"
name = "pluto_support_policy"
source = "support-policy.rs"

[[module]]
id = "placement-commit"
file = "crates/horizon-client/src/game.rs"
name = "pluto_placement_commit"
source = "placement-commit.rs"
