[mod]
id = "pluto_tool_rules"
version = "0.1.0"
priority = 100
[compatibility]
horizon_revision = "7124749605ed577f7e3775a573662eb3c3619cb2"
[[module]]
id = "api"
file = "crates/horizon-items/src/items.rs"
name = "pluto_tool_rules"
source = "rules.rs"
visibility = "pub"
[[injection]]
id = "speed"
target = "horizon_items::items::Items::mining_speed"
kind = "RETURN"
helper = "speed.rs"
bindings = [
  { name = "value", ty = "f32", value = "$value" },
  { name = "items", ty = "&Items", value = "self" },
  { name = "held", ty = "Option<&ItemStack>", value = "held" },
  { name = "block", ty = "&str", value = "block" },
]
[[injection]]
id = "drops"
target = "horizon_items::items::Items::correct_for_drops"
kind = "RETURN"
helper = "drops.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "items", ty = "&Items", value = "self" },
  { name = "held", ty = "Option<&ItemStack>", value = "held" },
  { name = "block", ty = "&str", value = "block" },
]
