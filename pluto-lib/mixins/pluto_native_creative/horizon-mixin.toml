[[injection]]
id = "terrain-cell-head"
target = "horizon_client_render::mesher::Mesher<'_>::mesh_reusing"
kind = "HEAD"
priority = -2147483648
cancellable = true
helper = "terrain-cell-head.rs"
bindings = [{ name = "mesher", ty = "&mut Mesher<'_>", value = "self" }, { name = "region", ty = "&[[Option<&Chunk>; 3]; 3]", value = "region" }, { name = "sy", ty = "i32", value = "sy" }, { name = "out", ty = "&mut SectionMesh", value = "&mut out" }, { name = "scratch", ty = "&mut MeshScratch", value = "scratch" }]

