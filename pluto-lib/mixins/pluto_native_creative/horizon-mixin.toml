target = "horizon_client_lib::stations::ingredient"
kind = "HEAD"
cancellable = true
helper = "station-ingredient-head.rs"
bindings = [{ name = "value", ty = "&serde_json::Value", value = "v" }, { name = "items", ty = "&Items", value = "items" }]

# Startup-only pure geometry providers; native shading/culling stay native.
