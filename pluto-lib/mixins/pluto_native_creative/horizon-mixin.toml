[mod]
id = "pluto_native_creative"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "7084e67744cbb4fe25961f24126e15b6b36f0523"

[[crate]]
id = "creative-api"
path = "api"
dependent = "horizon-client"

[[crate]]
id = "inventory-api"
path = "inventory-api"
dependent = "horizon-client-lib"

[[module]]
id = "inventory-export"
file = "crates/horizon-client/src/client_lib.rs"
name = "pluto_inventory"
source = "inventory-export.rs"
visibility = "pub"

[[module]]
id = "landing-state-api"
file = "crates/horizon-client-render/src/chunk_map.rs"
name = "pluto_landing_state"
source = "landing-state.rs"
visibility = "pub"

[[state]]
id = "landing-state"
target = "horizon_client_render::chunk_map::ChunkMap"
ty = "std::collections::HashMap<i32, crate::chunk_map::pluto_landing_state::LandingState>"
initial = "::core::default::Default::default()"

[[state.constructor]]
target = "horizon_client_render::chunk_map::<ChunkMap as Default>::default"
selector = "Self"
require = 1

[[injection]]
id = "landing-state-clear"
target = "horizon_client_render::chunk_map::ChunkMap::clear"
kind = "HEAD"
helper = "landing-clear.rs"
bindings = [{ name = "map", ty = "&mut crate::chunk_map::ChunkMap", value = "&mut *self" }]
