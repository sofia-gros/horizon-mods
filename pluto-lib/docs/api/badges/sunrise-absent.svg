<svg xmlns="http://www.w3.org/2000/svg" width="92" height="20" role="img" aria-label="Sunrise: absent">
  <title>Sunrise: absent</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="92" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="48" height="20" fill="#555"/>
    <rect x="48" width="44" height="20" fill="#9f9f9f"/>
    <rect width="92" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11">
    <text x="24.0" y="15" fill="#010101" fill-opacity=".3">Sunrise</text>
    <text x="24.0" y="14">Sunrise</text>
    <text x="70.0" y="15" fill="#010101" fill-opacity=".3">absent</text>
