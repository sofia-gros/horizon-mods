# Block color providers: wrap the section mesher's face call, preserving the native renderer.
# A face-local Info copy supplies the provider tint without changing shared mesh tables.
[[module]]
id = "block-color-bridge"
file = "crates/horizon-client-render/src/mesher.rs"
name = "pluto_block_colors"
source = "pluto-block-colors.rs"
visibility = "pub"

[[injection]]
id = "block-color-world-tint"
target = "horizon_client_render::mesher::Mesher<'_>::mesh_reusing"
kind = "WRAP_OPERATION"
selector = "self.face"
require = 1
ordinal = 0
helper = "pluto-block-color-tint.rs"
bindings = [
    { name = "mesher", ty = "&Mesher<'_>", value = "$receiver" },
    { name = "pad", ty = "&Padded", value = "$arg0" },
    { name = "tints", ty = "&mut Tints", value = "$arg1" },
    { name = "out", ty = "&mut SectionMesh", value = "$arg2" },
    { name = "pos", ty = "[i32; 3]", value = "$arg3" },
    { name = "origin", ty = "[f32; 3]", value = "$arg4" },
    { name = "face", ty = "&BakedFace", value = "$arg5" },
    { name = "ao", ty = "bool", value = "$arg6" },
    { name = "state", ty = "(u32, &Info)", value = "$arg7" },
    { name = "world", ty = "BlockPos", value = "$arg8" },
    { name = "interior_leaf", ty = "bool", value = "$arg9" },
    { name = "original", ty = "impl FnOnce(&Mesher<'_>, &Padded, &mut Tints, &mut SectionMesh, [i32; 3], [f32; 3], &BakedFace, bool, (u32, &Info), BlockPos, bool)", value = "$operation" },
]

# Successful server teardown, after the final save and networking cleanup.
[[module]]
id = "server-stopped-dispatch"
file = "crates/horizon-client/src/game.rs"
name = "pluto_server_stopped"
source = "pluto-server-stopped.rs"
visibility = "pub"

[[injection]]
id = "server-stopped-integrated"
target = "horizon_client::game::integrated::Game<'_>::run_integrated"
kind = "RETURN"
helper = "pluto-server-stopped-return.rs"
bindings = [{ name = "value", ty = "Result<()>", value = "$value" }]

[[injection]]
id = "server-stopped-dedicated"
target = "horizon_client::game::dedicated::Game<'_>::run_dedicated"
kind = "RETURN"
helper = "pluto-server-stopped-dedicated-return.rs"
bindings = [{ name = "value", ty = "Result<()>", value = "$value" }]

