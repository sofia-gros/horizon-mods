# Mob itself is externally constructible, so Mixins refuses adding its fields.
# Its owned Navigation has private fields and a concrete Default literal. It is
# not replaced during the pinned spawn tails; moves retain and clones discard.
[[module]]
id = "pluto-entity-spawn-state-module"
file = "crates/horizon-client/src/mobs/nav.rs"
name = "pluto_entity_spawn_state"
source = "pluto-entity-spawn-state.rs"
visibility = "pub"

[[state]]
id = "pluto-entity-spawn-state"
target = "horizon_client_lib::mobs::nav::Navigation"
ty = "crate::mobs::nav::pluto_entity_spawn_state::SpawnState"
initial = "::core::default::Default::default()"

[[state.constructor]]
target = "horizon_client_lib::mobs::nav::<Navigation as Default>::default"
selector = "Self"
require = 1

