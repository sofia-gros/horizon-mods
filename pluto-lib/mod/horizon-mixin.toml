bindings = [
 { name = "game", ty = "&mut Game<'_>", value = "&mut *self" }
]

# Capture the final owned item map, not its earlier insert/reference accesses.
# The raw Arc is the loader's own snapshot. Native LOAD/type validation is pending native attachment validation.
[[injection]]
id = "pluto-item-prototypes"
target = "horizon_items::items::Items::load_with"
kind = "MODIFY_VARIABLE"
helper = "pluto-item-prototypes.rs"
variable = { name = "items", ordinal = 0, at = "LOAD" }
require = 3
ordinal = 2
bindings = [
 { name = "value", ty = "HashMap<Arc<str>, ItemInfo>", value = "$value" },
 { name = "raw", ty = "&Arc<horizon_world::item_defaults::Defaults>", value = "$local_ref:raw:0" }
]

