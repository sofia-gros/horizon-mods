# PlutoLib: Horizon's Fabric API. A trait mod (see docs/native-mods.md, "Trait mods"): the launcher links the
# [api] package into the game, and mods that declare "pluto_lib" in [dependencies] call its API.
[mod]
id = "pluto_lib"
version = "0.1.0"

[compatibility]
horizon_revision = "441f49d57e344bd56b90fd4af5c4e443ff3937c9"

[api]
path = "api"

# PlutoLib-owned direct edits stage custom menu clicks inside the native engine.
# These declarations are transferred by prepare_direct_host, not applied twice.
[[injection]]
id = "pluto-menu-actions"
target = "horizon_client_lib::menu::Menu::click"
kind = "HEAD"
require = 1
helper = "pluto-menu-actions.rs"
bindings = []

[[injection]]
id = "pluto-menu-actions-local"
target = "horizon_client::game::menu_clicks::Game<'_>::menu_session"
kind = "OVERWRITE"
require = 1
helper = "pluto-menu-actions.rs"
bindings = []

[[injection]]
id = "pluto-menu-actions-guest"
target = "horizon_client::game::lan_crafting::Game<'_>::lan_machine_click"
kind = "OVERWRITE"
require = 1
helper = "pluto-menu-actions.rs"
bindings = []

# Check every candidate, including results reached from a different clicked slot.
[[injection]]
id = "pluto-menu-pick-all"
target = "horizon_client_lib::menu::Menu::can_take_for_pick_all"
kind = "HEAD"
cancellable = true
helper = "pluto-menu-pick-all-head.rs"
bindings = [
 { name = "menu", ty = "&Menu", value = "&*self" },
 { name = "slot", ty = "usize", value = "t" }
]

