target = "horizon_client_lib::mobs::living::Mob::cause_fall_damage_at"
kind = "MODIFY_VARIABLE"
variable = { name = "damage", ordinal = 0, at = "LOAD" }
require = 1
ordinal = 0
helper = "pluto-living-entity-fall.rs"
bindings = [{ name = "value", ty = "f64", value = "$value" }, { name = "mob", ty = "&Mob", value = "&*self" }, { name = "distance", ty = "f64", value = "$local:distance:0" }, { name = "multiplier", ty = "f32", value = "$local:modifier:0" }]

