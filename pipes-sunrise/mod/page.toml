# Classic Pipes (Sunrise edition) — registry page. M1 prep DRAFT.
# Placement at execution: pipes-sunrise/mod/page.toml
# Screenshot placement:   pipes-sunrise/mod/page/pipes-transit.png
#
# Schema (Sunrise modding book, "Publishing your mod" / cargo-sunrise-mod page
# checks):
# - summary >= 25 chars, description >= 125 chars (Unicode scalars after
#   trimming).
# - name / authors / homepage / issues default from sunrise-mod.toml; set here
#   to pin what the page shows. Page-only keys are exactly: summary,
#   description, categories, screenshots, name, authors, homepage, issues.
#   (The PlutoLib execution lane's check rejected `license` and `source` in
#   page.toml — do not add them here.)
# - categories omitted on purpose: IDs are maintainer-owned in the registry's
#   registry/categories.toml and must fit kind "native-mod"; a wrong ID fails
#   `cargo sunrise-mod check`.
# - SCREENSHOT IS PENDING: page/pipes-transit.png does not exist yet. It is
#   captured in-game on the Sunrise client during the M5 smoke (item and fluid
#   pipes moving contents between a chest and a Tinkers' Construct tank) and
#   must land before the page gate of `cargo sunrise-mod check` can pass and
#   before the release freezes the page bundle.
# - The dependency paragraph in the description is the owner's specified
#   wording, verbatim, in the same form as the Horizon v1.0.0 release notes
#   (plan §1.3). Page description text for the mods is lane-drafted pending
#   owner review (plan §7.3).

summary = "Classic Pipes: item and fluid transport pipes — extraction and transport between chests, tanks, furnaces and Tinkers' Construct stations, built on PlutoLib."

description = """
Classic Pipes adds transport pipes in the classic extraction-pipe style:
an item pipe and an extraction pipe for items, and a fluid pipe and a
fluid extraction pipe for fluids. Pipes connect to chests, tanks,
furnaces and Tinkers' Construct blocks and move items and fluids
between neighbours; an extraction pipe pulls from the block behind it.

Every behaviour is implemented through PlutoLib's public API — the mod
injects nothing itself, on Sunrise exactly as on Horizon, and the same
source ships on both platforms.

PlutoLib v1.0.0以降が必要。v1.0.0向けに作成されました。新しいバージョンで動作しない場合は1.0.0を使用してください

This package is the Sunrise edition, built for Sunrise game 26.3. It
ships as source plus `Cargo.lock`; the launcher builds it on the
player's computer for the exact game build it pins.
"""

authors = ["sofia-gros"]
homepage = "https://github.com/sofia-gros/horizon-mods"
issues = "https://github.com/sofia-gros/horizon-mods/issues"

[[screenshots]]
path = "page/pipes-transit.png"
