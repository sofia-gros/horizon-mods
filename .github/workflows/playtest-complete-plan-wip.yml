name: WIP fixed playtest complete plan diagnostic
on:
  push:
    branches:
      - checkpoint/tinkers-playtest-complete-plan-ci-20261106
permissions:
  contents: read
concurrency:
  group: playtest-complete-plan-wip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playtest-plan:
    if: ${{ github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/tinkers-playtest-complete-plan-ci-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Diagnose the complete frozen playtest without applying
        id: diagnostic
        run: python3 pluto-lib/experiments/playtest-plan-ci/run.py
      - name: Preserve bounded public plan diagnostic evidence
        if: ${{ always() && steps.diagnostic.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playtest-plan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playtest-plan-evidence-${{ github.sha }}/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 6
          retention-days: 3
