      # The unfiltered cargo test run also covered the doctests; they are the
      # separate doctests job now (--lib here, --doc there).
      - name: Pure suite (unit tests)
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo test --locked --manifest-path pluto-lib/tests/pure/Cargo.toml --lib
