name: Mixins validation
on:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: mixins-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py
      - name: Install build prerequisites
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Restore Cargo cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli-build
            target/ci-build
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-
      - name: Test resource preparation and command transactions
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tconstruct/tests -v
          python3 -m unittest discover -s pluto-lib/tests -p "test_package_native.py" -v
          cargo test --locked --manifest-path tconstruct/tests/condition-snapshot/Cargo.toml
          cargo test --locked --manifest-path tconstruct/tests/glass-crafting/Cargo.toml
          cargo test --locked --manifest-path tconstruct/tests/book-wire/Cargo.toml
          SOUL_REPO_ROOT="$GITHUB_WORKSPACE" cargo test --locked --manifest-path tconstruct/tests/soul-glass/Cargo.toml
          rustc --edition=2021 --test tconstruct/tests/rust/source_fluid_display.rs -o /tmp/tconstruct-fluid-display-test
          /tmp/tconstruct-fluid-display-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_grass_meal.rs -o /tmp/tconstruct-slime-grass-meal-test
          /tmp/tconstruct-slime-grass-meal-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_seed_use.rs -o /tmp/tconstruct-slime-seed-use-test
          /tmp/tconstruct-slime-seed-use-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_seed_rules.rs -o /tmp/tconstruct-slime-seed-rules-test
          /tmp/tconstruct-slime-seed-rules-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_plant_support.rs -o /tmp/tconstruct-slime-plant-support-test
          /tmp/tconstruct-slime-plant-support-test
          rustc --edition=2021 --test tconstruct/tests/rust/broad_wire.rs -o /tmp/tconstruct-broad-wire-test
          /tmp/tconstruct-broad-wire-test
          rustc --test tconstruct/tests/rust/command.rs -o /tmp/tconstruct-command-test
          /tmp/tconstruct-command-test
          rustc --test tconstruct/tests/rust/recipe_snapshot.rs -o /tmp/tconstruct-recipe-snapshot-test
          /tmp/tconstruct-recipe-snapshot-test
          rustc --test tconstruct/tests/rust/material_snapshot.rs -o /tmp/tconstruct-material-snapshot-test
          /tmp/tconstruct-material-snapshot-test
          rustc --test tconstruct/tests/rust/source_builder_wire.rs -o /tmp/tconstruct-source-builder-wire-test
          /tmp/tconstruct-source-builder-wire-test
          rustc --test tconstruct/tests/rust/source_builder_layout.rs -o /tmp/tconstruct-source-builder-layout-test
          /tmp/tconstruct-source-builder-layout-test
          rustc --edition=2021 --test tconstruct/tests/rust/materials_book_index.rs -o /tmp/tconstruct-materials-book-index-test
          /tmp/tconstruct-materials-book-index-test
          rustc --edition=2021 --test tconstruct/tests/rust/source_part_material_id.rs -o /tmp/tconstruct-part-material-id-test
          /tmp/tconstruct-part-material-id-test
          rustc --edition=2021 --test tconstruct/tests/rust/source_cast_info.rs -o /tmp/tconstruct-cast-info-test
          /tmp/tconstruct-cast-info-test
          rustc --edition=2021 --test tconstruct/tests/rust/native_item_durability.rs -o /tmp/tconstruct-native-item-test
          /tmp/tconstruct-native-item-test
          rustc --test tconstruct/tests/rust/original_item_durability.rs -o /tmp/tconstruct-original-item-test
          /tmp/tconstruct-original-item-test
          rustc --test tconstruct/tests/rust/original_crafting_remainders.rs -o /tmp/tconstruct-original-remainder-test
          /tmp/tconstruct-original-remainder-test
      - name: Fetch upstream sources
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          git init ../horizon-official
          git -C ../horizon-official remote add origin https://github.com/horizon-rust/horizon.git
          HORIZON_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["horizon_revision"])')"
          git -C ../horizon-official fetch --depth 1 origin "$HORIZON_REVISION"
          git -C ../horizon-official checkout --detach FETCH_HEAD
          git init ../horizon-mixins
          git -C ../horizon-mixins remote add origin https://github.com/horizon-rust/horizon-mixins.git
          MIXINS_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["mixins_revision"])')"
          git -C ../horizon-mixins fetch --depth 1 origin "$MIXINS_REVISION"
          git -C ../horizon-mixins checkout --detach FETCH_HEAD
      - name: Apply Mixins and check client
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pluto-source"
          python3 pluto-lib/tools/package_native.py "$RUNNER_TEMP/pluto-source/plutolib.hnmod"
          python3 tconstruct/tools/extract_pluto.py --horizon ../horizon-official --package "$RUNNER_TEMP/pluto-source/plutolib.hnmod" --output "$RUNNER_TEMP/pluto-installed"
          python3 tconstruct/tools/stage.py --horizon ../horizon-official --mixins ../horizon-mixins --mixins-revision "$(git -C ../horizon-mixins rev-parse HEAD)" --pluto-bundle "$RUNNER_TEMP/pluto-installed/pluto_native_creative/mixins/pluto_native_creative"
          cargo check --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --bin horizon-client --no-default-features
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p tconstruct-source-config --lib
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_station_recipes::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_recipes::foundry_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::slimelytra_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::slimeskull_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::first_material_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::tool_fluid_swap_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::slimeskull_part_swap_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_state::swap_presentation_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_state::first_material_input_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_state::slimelytra_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::tipped_clearing_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_tip_clearing::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_mining_stack::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-items --lib --no-default-features --profile fast tconstruct_source_mining_rules::haste_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_haste_source::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_haste_wire::tests
          cargo test --locked --manifest-path tconstruct/tests/haste-wire-fixture/Cargo.toml
          python3 tconstruct/tests/run_gold_guard.py --horizon ../horizon-official
          python3 tconstruct/tests/run_expanded_hammer.py --horizon ../horizon-official
          rustc --edition=2021 --test tconstruct/tests/rust/source_area_protection.rs -o /tmp/tconstruct-area-protection-test
          /tmp/tconstruct-area-protection-test
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_gold_guard::tests -- --nocapture | tee "$RUNNER_TEMP/gold-guard-tests.log"
          grep -Fq "test game::tconstruct_gold_guard::tests::count_neutral_slots_once_not_modifier_levels ... ok" "$RUNNER_TEMP/gold-guard-tests.log"
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_upgrade_rules::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_state::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_render::fluid_light_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_state::casting_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melter_state::tagged_portable_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_smeltery_state::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_smeltery_fuel::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-items --lib --no-default-features --profile fast tconstruct_recycling_rng::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_tx::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_fluid_container::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_tags::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_melting_lookup::part_swap_predicate_tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_recipe_order::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_stat_types::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_render_info::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_mantle_layer::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_part_name::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_part_material_id_host_tests::tests
      - name: Test fluid effect selection isolation
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" tconstruct/tests/run_fluid_effect_selection_rust.sh
      - name: Test bounded survival helper chain
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" tconstruct/tests/run_survival_chain_rust.sh
      - name: Package native mod sources and resource inputs
        run: python3 tconstruct/tools/package_hnmod.py --output dist/tconstruct.hnmod
      - name: Package content mod
        run: python3 tconstruct/tools/package_hmod.py --output dist/tconstruct.hmod
      - name: Upload mod artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tconstruct-hnmod-${{ github.sha }}
          path: |
            dist/tconstruct.hnmod
            dist/tconstruct.hmod
          if-no-files-found: error
