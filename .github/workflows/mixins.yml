            .local/cargo-target-ci
          key: ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-
      # Mirrors the domain job for the pipes mod's suite; it exists in the
      # tree and CI covers it so every test suite runs.
      - name: Domain suite (tests/pipes-domain)
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo test --locked --manifest-path tests/pipes-domain/Cargo.toml
  mixins-validation:
    name: Mixins validation (weave plan + guarded build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/cargo-target-ci
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py
      # The toolchain directory is a pure function of the pinned version,
      # the minimal profile, the rustfmt component and the runner platform
      # (all named in the key), so a hit safely skips the download/install.
      # `rustup default` still runs: it only writes ~/.rustup/settings.toml,
      # which is not part of the cached directory. The path names the
      # x86_64-unknown-linux-gnu toolchain these ubuntu-24.04 jobs use; on
      # any other platform the path simply misses and the install runs.
      - name: Cache Rust toolchain 1.95.0
        id: rust-toolchain-cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu
          key: ${{ runner.os }}-${{ runner.arch }}-rustup-1.95.0-minimal-rustfmt-v1
      - name: Install build prerequisites
        id: prereqs
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          if [ "${{ steps.rust-toolchain-cache.outputs.cache-hit }}" != 'true' ]; then
            rustup toolchain install 1.95.0 --profile minimal
            rustup component add rustfmt --toolchain 1.95.0
          fi
          rustup default 1.95.0
      # Split restore/save: the combined actions/cache saves only in a
      # post step gated on success(), so a job that fails later could
      # never populate this cache. This save runs under always() once
      # the prerequisites step has succeeded; continue-on-error keeps a
      # cache-service failure from changing the job's conclusion.
      - name: Save Rust toolchain 1.95.0 cache
        if: always() && steps.scope.outputs.docs_only != 'true' && steps.rust-toolchain-cache.outputs.cache-hit != 'true' && steps.prereqs.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu
          key: ${{ runner.os }}-${{ runner.arch }}-rustup-1.95.0-minimal-rustfmt-v1
      - name: Restore Cargo cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli-build
            .local/cargo-target-ci
          key: ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-
      - name: Fetch upstream sources
        if: steps.scope.outputs.docs_only != 'true'
        env:
          # A failed fetch must surface as a clean error, never as an
          # interactive credential prompt (CI rounds 10/10b died with
          # exit 128, "could not read Username", when an anonymous
          # fetch was answered with a GitHub 401 auth challenge).
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Authenticate with the workflow token: anonymous git
          # fetches from shared runner IPs intermittently draw a 401
          # challenge even for these public repos (rounds 10/10b).
          # Each fetch retries up to 3 times so a single blip does not
          # kill the job. What is fetched is unchanged: the pinned
          # revisions from tconstruct/compatibility.json, depth 1,
          # detached checkout.
          fetch_pinned() {
            for attempt in 1 2 3; do
              if git -C "$1" fetch --depth 1 origin "$2"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            return 1
          }
          git init ../horizon-official
          git -C ../horizon-official remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/horizon-rust/horizon.git"
          HORIZON_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["horizon_revision"])')"
          fetch_pinned ../horizon-official "$HORIZON_REVISION"
          git -C ../horizon-official checkout --detach FETCH_HEAD
          git init ../horizon-mixins
          git -C ../horizon-mixins remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/horizon-rust/horizon-mixins.git"
          MIXINS_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["mixins_revision"])')"
          fetch_pinned ../horizon-mixins "$MIXINS_REVISION"
          git -C ../horizon-mixins checkout --detach FETCH_HEAD
      - name: Read pinned revisions
        id: pins
        run: |
          echo "mixins_revision=$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["mixins_revision"])')" >> "$GITHUB_OUTPUT"
      # The CLI binary is a pure function of the pinned horizon-mixins
      # revision (a git SHA, so it content-addresses the CLI sources and
      # their locked dependencies), the Rust toolchain version and the
      # runner platform, all named in the key. Bump the -vN suffix if the
      # build command below ever changes. On a hit the build step below is
      # skipped entirely; the restored file lands at the exact path the
      # guarded build consumes.
      - name: Cache pinned Mixins CLI build
        id: mixins-cli-cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/mixins-cli-build/release/horizon-mixins
          key: ${{ runner.os }}-${{ runner.arch }}-mixins-cli-rust-1.95.0-${{ steps.pins.outputs.mixins_revision }}-v1
      - name: Build pinned official Mixins CLI
        id: mixins-cli-build
        if: steps.scope.outputs.docs_only != 'true' && steps.mixins-cli-cache.outputs.cache-hit != 'true'
        run: cargo +1.95.0 build --locked --release --manifest-path ../horizon-mixins/Cargo.toml -p horizon-mixins-cli --target-dir target/mixins-cli-build
      # Split restore/save, as with the toolchain cache above: the
      # combined actions/cache saved in a post step gated on success(),
      # and this job is exactly the one that may fail (the guarded build
      # below), so the cache could never be populated (CI rounds 6-7:
      # post step skipped, the 60 s build re-ran). This save runs under
      # always() once the build itself has succeeded; continue-on-error
      # keeps a cache-service failure from changing the job's conclusion.
      - name: Save pinned Mixins CLI build
        if: always() && steps.scope.outputs.docs_only != 'true' && steps.mixins-cli-cache.outputs.cache-hit != 'true' && steps.mixins-cli-build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/mixins-cli-build/release/horizon-mixins
          key: ${{ runner.os }}-${{ runner.arch }}-mixins-cli-rust-1.95.0-${{ steps.pins.outputs.mixins_revision }}-v1
      - name: Fetch locked host dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo +1.95.0 fetch --locked --manifest-path ../horizon-official/Cargo.toml
      - name: Build guarded clean development game
        if: steps.scope.outputs.docs_only != 'true'
        # All guards precede apply/compilation; failure stops consumer/entry linking.
        # Same build entry as local development; no launcher/gameplay/release claim.
        run: python3 tools/build_clean_game.py --source ../horizon-official --output .local/clean-port/ci-native --mixins target/mixins-cli-build/release/horizon-mixins --target-dir .local/cargo-target-ci
      - name: Upload native planning diagnostics
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-native-plan-${{ github.sha }}
          path: |
            .local/clean-port/ci-native/plan.json
            .local/clean-port/ci-native/plan-result.json
            .local/clean-port/ci-native/direct-host.json
            .local/clean-port/ci-native/contract-check.json
            .local/clean-port/ci-native/native-check.json
            .local/clean-port/ci-native/api-check.json
            .local/clean-port/ci-native/consumer-check.json
            .local/clean-port/ci-native/game-entry-check.json
            .local/clean-port/ci-native/game-entry-link.json
            .local/clean-port/ci-native/game-entry-link.log
          include-hidden-files: true
          if-no-files-found: warn
  summary:
    name: Summary (all suites)
    if: always()
    needs: [lint, census, package, python-tests, pure, doctests, domain, pipes-domain, mixins-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R_LINT: ${{ needs.lint.result }}
      R_CENSUS: ${{ needs.census.result }}
      R_PACKAGE: ${{ needs.package.result }}
      R_PYTHON: ${{ needs.python-tests.result }}
      R_PURE: ${{ needs.pure.result }}
      R_DOCTESTS: ${{ needs.doctests.result }}
      R_DOMAIN: ${{ needs.domain.result }}
      R_PIPES: ${{ needs.pipes-domain.result }}
      R_MIXINS: ${{ needs.mixins-validation.result }}
    steps:
      - name: Suite summary
        run: |
          {
            echo '## Suite results'
            echo ''
            echo '| Suite | Result |'
            echo '| --- | --- |'
            echo "| Lint (5 checks) | $R_LINT |"
            echo "| Census (port.py check + test_clean_port) | $R_CENSUS |"
            echo "| Package (development hnmod) | $R_PACKAGE |"
            echo "| Python tests (root + PlutoLib) | $R_PYTHON |"
            echo "| Pure suite (PlutoLib unit tests) | $R_PURE |"
            echo "| Doctests (API page examples) | $R_DOCTESTS |"
            echo "| Domain suite (Tinkers) | $R_DOMAIN |"
            echo "| Domain suite (Pipes) | $R_PIPES |"
            echo "| Mixins validation (weave plan + guarded build) | $R_MIXINS |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for r in "$R_LINT" "$R_CENSUS" "$R_PACKAGE" "$R_PYTHON" "$R_PURE" "$R_DOCTESTS" "$R_DOMAIN" "$R_PIPES" "$R_MIXINS"; do
            if [ "$r" != 'success' ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo 'At least one suite did not succeed; see the table above and the per-suite jobs.'
            exit 1
          fi
          echo 'All suites succeeded.'
