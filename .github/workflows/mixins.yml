            ~/.cargo/git
            target/mixins-cli-build
            .local/cargo-target-ci
          key: ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
