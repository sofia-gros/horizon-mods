name: Mixins validation
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: mixins-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Never cancel an in-progress run: every suite must run to completion so a
  # run always reports the full set of results (owner instruction, 2026-11-24).
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  pull-requests: read
# All suite jobs below are independent (no needs between them), so GitHub runs
# them in parallel and no suite's failure can skip or cancel another suite.
# Multi-suite jobs run every suite step (if: always()) and fail only in a
# final aggregate step that lists every failure. The summary job runs last
# (if: always()) and turns the per-suite results into one overall signal.
jobs:
  lint:
    name: Lint (5 checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job's steps read only the worktree and the git index
          # (git ls-files / plain file scans); nothing needs history.
          fetch-depth: 1
      - name: check_line_endings
        if: always()
        run: |
          rc=0
          python3 tools/check_line_endings.py || rc=$?
          echo "check_line_endings=$rc" >> "$RUNNER_TEMP/lint-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=check_line_endings::check_line_endings.py exited with $rc"; fi
      - name: check_docs_budget
        if: always()
        run: |
          rc=0
          python3 tools/check_docs_budget.py || rc=$?
          echo "check_docs_budget=$rc" >> "$RUNNER_TEMP/lint-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=check_docs_budget::check_docs_budget.py exited with $rc"; fi
      - name: check_api_docs
        if: always()
        run: |
          rc=0
          python3 tools/check_api_docs.py || rc=$?
          echo "check_api_docs=$rc" >> "$RUNNER_TEMP/lint-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=check_api_docs::check_api_docs.py exited with $rc"; fi
      - name: check_injection_ownership
        if: always()
        run: |
          rc=0
          python3 tools/check_injection_ownership.py || rc=$?
          echo "check_injection_ownership=$rc" >> "$RUNNER_TEMP/lint-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=check_injection_ownership::check_injection_ownership.py exited with $rc"; fi
      - name: lint_forbidden_api
        if: always()
        run: |
          rc=0
          python3 tools/lint_forbidden_api.py || rc=$?
          echo "lint_forbidden_api=$rc" >> "$RUNNER_TEMP/lint-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=lint_forbidden_api::lint_forbidden_api.py exited with $rc"; fi
      - name: Lint result
        if: always()
        run: |
          echo 'Per-check exit codes:'
          cat "$RUNNER_TEMP/lint-results"
          if grep -vq '=0$' "$RUNNER_TEMP/lint-results"; then
            echo 'FAILED checks:'
            grep -v '=0$' "$RUNNER_TEMP/lint-results"
            exit 1
          fi
          echo 'All 5 lint checks passed.'
  census:
    name: Census (port.py check + test_clean_port)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job's steps read only the worktree and the git index
          # (git ls-files / plain file scans); nothing needs history.
          fetch-depth: 1
      - name: Validate clean Tinkers boundary (port.py check)
        if: always()
        run: |
          rc=0
          python3 tools/port.py check || rc=$?
          echo "port_check=$rc" >> "$RUNNER_TEMP/census-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=port.py check::port.py check exited with $rc"; fi
      - name: Census (test_clean_port.py)
        if: always()
        run: |
          rc=0
          python3 -m unittest discover -s tests -p test_clean_port.py -v || rc=$?
          echo "census=$rc" >> "$RUNNER_TEMP/census-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=test_clean_port::test_clean_port.py exited with $rc"; fi
      - name: Census result
        if: always()
        run: |
          echo 'Per-suite exit codes:'
          cat "$RUNNER_TEMP/census-results"
          if grep -vq '=0$' "$RUNNER_TEMP/census-results"; then
            echo 'FAILED suites:'
            grep -v '=0$' "$RUNNER_TEMP/census-results"
            exit 1
          fi
          echo 'port.py check and census both passed.'
  package:
    name: Package (development hnmod)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job's steps read only the worktree and the git index
          # (git ls-files / plain file scans); nothing needs history.
          fetch-depth: 1
      # Independent of every test job on purpose: the package is always built
      # and uploaded; the manager decides what ships.
      - name: Build development package
        run: python3 tools/port.py package --output .local/clean-port/ci-tconstruct.hnmod
      - name: Upload checked development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-tconstruct-development-${{ github.sha }}
          path: .local/clean-port/ci-tconstruct.hnmod
          include-hidden-files: true
          if-no-files-found: error
  python-tests:
    name: Python tests (root + PlutoLib)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/cargo-target-ci
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py
      # The toolchain directory is a pure function of the pinned version,
      # the minimal profile, the rustfmt component and the runner platform
      # (all named in the key), so a hit safely skips the download/install.
      # `rustup default` still runs: it only writes ~/.rustup/settings.toml,
      # which is not part of the cached directory. The path names the
      # x86_64-unknown-linux-gnu toolchain these ubuntu-24.04 jobs use; on
      # any other platform the path simply misses and the install runs.
      - name: Cache Rust toolchain 1.95.0
        id: rust-toolchain-cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu
          key: ${{ runner.os }}-${{ runner.arch }}-rustup-1.95.0-minimal-rustfmt-v1
      - name: Install build prerequisites
        id: prereqs
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          if [ "${{ steps.rust-toolchain-cache.outputs.cache-hit }}" != 'true' ]; then
            rustup toolchain install 1.95.0 --profile minimal
            rustup component add rustfmt --toolchain 1.95.0
          fi
          rustup default 1.95.0
      # Split restore/save: the combined actions/cache saves only in a
      # post step gated on success(), so a job that fails later could
      # never populate this cache. This save runs under always() once
      # the prerequisites step has succeeded; continue-on-error keeps a
      # cache-service failure from changing the job's conclusion.
      - name: Save Rust toolchain 1.95.0 cache
        if: always() && steps.scope.outputs.docs_only != 'true' && steps.rust-toolchain-cache.outputs.cache-hit != 'true' && steps.prereqs.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu
          key: ${{ runner.os }}-${{ runner.arch }}-rustup-1.95.0-minimal-rustfmt-v1
      - name: Restore Cargo cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli-build
            .local/cargo-target-ci
          key: ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clean-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-
      # Frozen Tinkers tests are not executed or counted as clean-port parity.
      # Retained root and PlutoLib contracts remain mandatory; gameplay is R2-R5.
      - name: Root tests (tests/)
        if: ${{ always() && steps.scope.outputs.docs_only != 'true' }}
        run: |
          rc=0
          python3 -m unittest discover -s tests -v || rc=$?
          echo "root_tests=$rc" >> "$RUNNER_TEMP/python-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=root tests::unittest discover -s tests exited with $rc"; fi
      - name: PlutoLib Python tests (pluto-lib/tests)
        if: ${{ always() && steps.scope.outputs.docs_only != 'true' }}
        run: |
          rc=0
          PLUTO_TEST_FETCH_LOCKED=1 python3 -m unittest discover -s pluto-lib/tests -v || rc=$?
          echo "pluto_tests=$rc" >> "$RUNNER_TEMP/python-results"
          if [ "$rc" -ne 0 ]; then echo "::error title=PlutoLib Python tests::unittest discover -s pluto-lib/tests exited with $rc"; fi
      - name: Python tests result
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/python-results" ]; then
            echo 'No Python suites ran (docs-only scope).'
            exit 0
          fi
          echo 'Per-suite exit codes:'
          cat "$RUNNER_TEMP/python-results"
          if grep -vq '=0$' "$RUNNER_TEMP/python-results"; then
            echo 'FAILED suites:'
            grep -v '=0$' "$RUNNER_TEMP/python-results"
            exit 1
          fi
          echo 'All Python suites in this job passed.'
