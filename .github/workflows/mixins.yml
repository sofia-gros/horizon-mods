name: Mixins validation
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: mixins-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py
      - name: Forbidden-API lint
        run: |
          python3 tools/check_line_endings.py
          python3 tools/check_docs_budget.py
          python3 tools/check_api_docs.py
          python3 tools/check_injection_ownership.py
          python3 tools/lint_forbidden_api.py
      - name: Install build prerequisites
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup component add rustfmt --toolchain 1.95.0
      - name: Restore Cargo cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli-build
            target/ci-build
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-
      - name: Test resource preparation and command transactions
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tconstruct/tests -v
          PLUTO_TEST_FETCH_LOCKED=1 python3 -m unittest discover -s pluto-lib/tests -v
          cargo test --locked --manifest-path pluto-lib/tests/pure/Cargo.toml
          cargo test --locked --manifest-path tconstruct/library/Cargo.toml
          cargo test --locked --manifest-path tconstruct/tests/condition-snapshot/Cargo.toml
          cargo test --locked --manifest-path tconstruct/tests/glass-crafting/Cargo.toml
          cargo test --locked --manifest-path tconstruct/tests/book-wire/Cargo.toml
          SOUL_REPO_ROOT="$GITHUB_WORKSPACE" cargo test --locked --manifest-path tconstruct/tests/soul-glass/Cargo.toml
          rustc --edition=2021 --test tconstruct/tests/rust/source_fluid_display.rs -o /tmp/tconstruct-fluid-display-test
          /tmp/tconstruct-fluid-display-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_grass_meal.rs -o /tmp/tconstruct-slime-grass-meal-test
          /tmp/tconstruct-slime-grass-meal-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_seed_use.rs -o /tmp/tconstruct-slime-seed-use-test
          /tmp/tconstruct-slime-seed-use-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_seed_rules.rs -o /tmp/tconstruct-slime-seed-rules-test
          /tmp/tconstruct-slime-seed-rules-test
          rustc --edition=2021 --test tconstruct/tests/rust/slime_plant_support.rs -o /tmp/tconstruct-slime-plant-support-test
          /tmp/tconstruct-slime-plant-support-test
          rustc --edition=2021 --test tconstruct/tests/rust/broad_wire.rs -o /tmp/tconstruct-broad-wire-test
          /tmp/tconstruct-broad-wire-test
          rustc --test tconstruct/tests/rust/recipe_snapshot.rs -o /tmp/tconstruct-recipe-snapshot-test
          /tmp/tconstruct-recipe-snapshot-test
          rustc --test tconstruct/tests/rust/material_snapshot.rs -o /tmp/tconstruct-material-snapshot-test
          /tmp/tconstruct-material-snapshot-test
          rustc --test tconstruct/tests/rust/source_builder_wire.rs -o /tmp/tconstruct-source-builder-wire-test
          /tmp/tconstruct-source-builder-wire-test
          rustc --test tconstruct/tests/rust/source_builder_layout.rs -o /tmp/tconstruct-source-builder-layout-test
          /tmp/tconstruct-source-builder-layout-test
          rustc --edition=2021 --test tconstruct/tests/rust/materials_book_index.rs -o /tmp/tconstruct-materials-book-index-test
          /tmp/tconstruct-materials-book-index-test
          rustc --edition=2021 --test tconstruct/tests/rust/source_part_material_id.rs -o /tmp/tconstruct-part-material-id-test
          /tmp/tconstruct-part-material-id-test
          rustc --edition=2021 --test tconstruct/tests/rust/source_cast_info.rs -o /tmp/tconstruct-cast-info-test
          /tmp/tconstruct-cast-info-test
          rustc --edition=2021 --test tconstruct/tests/rust/native_item_durability.rs -o /tmp/tconstruct-native-item-test
          /tmp/tconstruct-native-item-test
          rustc --test tconstruct/tests/rust/original_item_durability.rs -o /tmp/tconstruct-original-item-test
          /tmp/tconstruct-original-item-test
          rustc --test tconstruct/tests/rust/original_crafting_remainders.rs -o /tmp/tconstruct-original-remainder-test
          /tmp/tconstruct-original-remainder-test
      - name: Fetch upstream sources
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          git init ../horizon-official
          git -C ../horizon-official remote add origin https://github.com/horizon-rust/horizon.git
          HORIZON_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["horizon_revision"])')"
          git -C ../horizon-official fetch --depth 1 origin "$HORIZON_REVISION"
          git -C ../horizon-official checkout --detach FETCH_HEAD
          git init ../horizon-mixins
          git -C ../horizon-mixins remote add origin https://github.com/horizon-rust/horizon-mixins.git
          MIXINS_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["mixins_revision"])')"
          git -C ../horizon-mixins fetch --depth 1 origin "$MIXINS_REVISION"
          git -C ../horizon-mixins checkout --detach FETCH_HEAD
      - name: Stage the vertical slice and check the client
        if: steps.scope.outputs.docs_only != 'true'
        # Only the slice in tools/smoke-local/slice.json is built while upstream
        # rejects the rest (see AGENTS.md). This does not launch the game.
        run: python3 tools/smoke-local/build.py --ci --horizon ../horizon-official --mixins ../horizon-mixins --work "$RUNNER_TEMP/slice-build"
      - name: Test fluid effect selection isolation
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" tconstruct/tests/run_fluid_effect_selection_rust.sh
      - name: Test Drain container action outcomes
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" python3 tconstruct/tests/run_drain_container.py
      - name: Test Cannon and Casting Tank preservation outcomes
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" python3 tconstruct/tests/run_cannon_held.py
      - name: Test shared inventory transaction guards
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" python3 tconstruct/tests/run_inventory_transaction_guards.py
      - name: Test lossless casting state transactions
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" tconstruct/tests/run_casting_preservation_rust.sh
      - name: Test bounded survival helper chain
        if: steps.scope.outputs.docs_only != 'true'
        run: HORIZON_HOST="$GITHUB_WORKSPACE/../horizon-official" tconstruct/tests/run_survival_chain_rust.sh
      - name: Package native mod sources and resource inputs
        run: python3 tconstruct/tools/package_hnmod.py --output dist/tconstruct.hnmod
      - name: Package content mod
        run: python3 tconstruct/tools/package_hmod.py --output dist/tconstruct.hmod
      - name: Upload mod artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tconstruct-hnmod-${{ github.sha }}
          path: |
            dist/tconstruct.hnmod
            dist/tconstruct.hmod
          if-no-files-found: error
