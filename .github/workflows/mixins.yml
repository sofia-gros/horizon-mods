name: Mixins validation
on:
  workflow_dispatch:
concurrency:
  group: mixins-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py
      - name: Install build prerequisites
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Restore Cargo cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli-build
            target/ci-build
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-${{ hashFiles('tconstruct/compatibility.json') }}-
      - name: Test resource preparation and command transactions
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tconstruct/tests -v
          rustc --edition=2021 --test tconstruct/tests/rust/broad_wire.rs -o /tmp/tconstruct-broad-wire-test
          /tmp/tconstruct-broad-wire-test
          rustc --test tconstruct/tests/rust/command.rs -o /tmp/tconstruct-command-test
          /tmp/tconstruct-command-test
          rustc --test tconstruct/tests/rust/recipe_snapshot.rs -o /tmp/tconstruct-recipe-snapshot-test
          /tmp/tconstruct-recipe-snapshot-test
          rustc --test tconstruct/tests/rust/material_snapshot.rs -o /tmp/tconstruct-material-snapshot-test
          /tmp/tconstruct-material-snapshot-test
          rustc --test tconstruct/tests/rust/source_config.rs -o /tmp/tconstruct-source-config-test
          /tmp/tconstruct-source-config-test
          rustc --test tconstruct/tests/rust/source_builder_wire.rs -o /tmp/tconstruct-source-builder-wire-test
          /tmp/tconstruct-source-builder-wire-test
          rustc --test tconstruct/tests/rust/source_builder_layout.rs -o /tmp/tconstruct-source-builder-layout-test
          /tmp/tconstruct-source-builder-layout-test
          rustc --edition=2021 --test tconstruct/tests/rust/source_cast_info.rs -o /tmp/tconstruct-cast-info-test
          /tmp/tconstruct-cast-info-test
          rustc --edition=2021 --test tconstruct/tests/rust/native_item_durability.rs -o /tmp/tconstruct-native-item-test
          /tmp/tconstruct-native-item-test
          rustc --test tconstruct/tests/rust/original_item_durability.rs -o /tmp/tconstruct-original-item-test
          /tmp/tconstruct-original-item-test
          rustc --test tconstruct/tests/rust/original_crafting_remainders.rs -o /tmp/tconstruct-original-remainder-test
          /tmp/tconstruct-original-remainder-test
      - name: Fetch upstream sources
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          git init ../horizon-official
          git -C ../horizon-official remote add origin https://github.com/horizon-rust/horizon.git
          HORIZON_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["horizon_revision"])')"
          git -C ../horizon-official fetch --depth 1 origin "$HORIZON_REVISION"
          git -C ../horizon-official checkout --detach FETCH_HEAD
          git init ../horizon-mixins
          git -C ../horizon-mixins remote add origin https://github.com/horizon-rust/horizon-mixins.git
          MIXINS_REVISION="$(python3 -c 'import json; print(json.load(open("tconstruct/compatibility.json"))["mixins_revision"])')"
          git -C ../horizon-mixins fetch --depth 1 origin "$MIXINS_REVISION"
          git -C ../horizon-mixins checkout --detach FETCH_HEAD
      - name: Apply Mixins and check client
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          git fetch --no-tags origin 5520a221655e9ea5b55b9ce32a46bca511c3ae71
          mkdir -p "$RUNNER_TEMP/pluto-source"
          git archive 5520a221655e9ea5b55b9ce32a46bca511c3ae71 pluto-lib | tar -x -C "$RUNNER_TEMP/pluto-source"
          mkdir -p "$RUNNER_TEMP/pluto-source/pluto-lib/.work"
          (cd "$RUNNER_TEMP/pluto-source/pluto-lib" && python3 tools/package_native.py .work/plutolib.hnmod)
          python3 tconstruct/tools/extract_pluto.py --horizon ../horizon-official --package "$RUNNER_TEMP/pluto-source/pluto-lib/.work/plutolib.hnmod" --output "$RUNNER_TEMP/pluto-installed"
          python3 tconstruct/tools/stage.py --horizon ../horizon-official --mixins ../horizon-mixins --mixins-revision "$(git -C ../horizon-mixins rev-parse HEAD)" --pluto-bundle "$RUNNER_TEMP/pluto-installed/pluto_native_creative/mixins/pluto_native_creative"
          cargo check --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --bin horizon-client --no-default-features
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-items --lib --no-default-features --profile fast tconstruct_recycling_rng::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_tx::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_tags::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_recipe_order::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_stat_types::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_render_info::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_mantle_layer::tests
          cargo test --locked --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --lib --no-default-features --profile fast tconstruct_source_part_name::tests
      - name: Package native mod sources and resource inputs
        run: python3 tconstruct/tools/package_hnmod.py --output dist/tconstruct.hnmod
      - name: Package content mod
        run: python3 tconstruct/tools/package_hmod.py --output dist/tconstruct.hmod
      - name: Upload mod artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tconstruct-hnmod-${{ github.sha }}
          path: |
            dist/tconstruct.hnmod
            dist/tconstruct.hmod
          if-no-files-found: error
