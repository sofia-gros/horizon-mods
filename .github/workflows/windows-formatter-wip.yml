name: WIP Windows fixed formatter regeneration
on:
  push:
    branches: [checkpoint/windows-formatter-199-ci-20261106]
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-formatter-199-only
  cancel-in-progress: false
jobs:
  formatter:
    if: github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/windows-formatter-199-ci-20261106'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Fixed source and resource preflight
        timeout-minutes: 1
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          & py -3.12 tconstruct/experiments/windows-formatter-ci/run.py --preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 2
        with:
          artifact-ids: '13513252348'
          run-id: 42236543685
          repository: sofia-gros/horizon-mods
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-formatter-plan
      - name: Admit and run only the pinned formatter
        timeout-minutes: 9
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          & py -3.12 tconstruct/experiments/windows-formatter-ci/run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
