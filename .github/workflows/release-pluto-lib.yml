name: Release PlutoLib
# Tag format: pluto-lib-vMAJOR.MINOR.PATCH (optionally -rc.N). Publishes pluto-lib.hnmod only.
on:
  push:
    tags:
      - 'pluto-lib-v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Check, test, package and validate
        run: |
          python3 tools/lint_forbidden_api.py
          python3 -m unittest discover -s tests
          cargo test --manifest-path pluto-lib/tests/base/Cargo.toml
          mkdir -p dist
          python3 tools/package_bundle.py pluto-lib/mod dist/pluto-lib.hnmod
          python3 tools/validate_release.py "$GITHUB_REF_NAME" dist
          (cd dist && sha256sum pluto-lib.hnmod > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            dist/pluto-lib.hnmod dist/SHA256SUMS
