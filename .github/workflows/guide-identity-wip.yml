name: WIP Guide identity helper contracts
on:
  push:
    branches:
      - checkpoint/guide-identity-ci-20261106
permissions:
  contents: read
concurrency:
  group: guide-identity-wip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guide-identity:
    if: ${{ github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/guide-identity-ci-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile once and verify two exact five-test groups
        run: python3 tconstruct/tests/guide-identity-ci/run.py
