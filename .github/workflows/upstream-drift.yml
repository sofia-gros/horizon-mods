name: Upstream drift
# Builds against the HEAD of horizon and horizon-mixins (NOT the pinned pair)
# to detect breaking upstream changes early. Failure here never blocks PRs;
# it is a signal to bump tconstruct/compatibility.json deliberately.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Fetch upstream HEAD
        run: |
          git clone --depth 1 https://github.com/horizon-rust/horizon.git ../horizon-head
          git clone --depth 1 https://github.com/horizon-rust/horizon-mixins.git ../mixins-head
          echo "horizon=$(git -C ../horizon-head rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "mixins=$(git -C ../mixins-head rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rewrite pins to upstream HEAD (throwaway workspace)
        run: |
          python3 tools/bump_upstream.py --horizon "$(git -C ../horizon-head rev-parse HEAD)" --mixins "$(git -C ../mixins-head rev-parse HEAD)"
      - name: Stage the slice and check the client against upstream HEAD
        run: python3 tools/smoke-local/build.py --ci --horizon ../horizon-head --mixins ../mixins-head --work "$RUNNER_TEMP/slice-build"
