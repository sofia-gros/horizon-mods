name: Upstream drift
# Builds against the HEAD of horizon and horizon-mixins (NOT the pinned pair)
# to detect breaking upstream changes early. Failure here never blocks PRs;
# it is a signal to bump tconstruct/compatibility.json deliberately.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Fetch upstream HEAD
        run: |
          git clone --depth 1 https://github.com/horizon-rust/horizon.git ../horizon-head
          git clone --depth 1 https://github.com/horizon-rust/horizon-mixins.git ../mixins-head
          echo "horizon=$(git -C ../horizon-head rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "mixins=$(git -C ../mixins-head rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stage and check client against upstream HEAD
        run: |
          mkdir -p "$RUNNER_TEMP/pluto-source"
          python3 pluto-lib/tools/package_native.py "$RUNNER_TEMP/pluto-source/plutolib.hnmod"
          python3 tconstruct/tools/extract_pluto.py --horizon ../horizon-head --package "$RUNNER_TEMP/pluto-source/plutolib.hnmod" --output "$RUNNER_TEMP/pluto-installed"
          python3 tconstruct/tools/stage.py --horizon ../horizon-head --mixins ../mixins-head --mixins-revision "$(git -C ../mixins-head rev-parse HEAD)" --pluto-bundle "$RUNNER_TEMP/pluto-installed/pluto_native_creative/mixins/pluto_native_creative"
          cargo check --manifest-path tconstruct/target/modded/Cargo.toml -p horizon-client --bin horizon-client --no-default-features
