name: WIP latest mining complete candidate plan only
on:
  push:
    branches:
      - checkpoint/plutolib-latest-mining-full-plan-ci-20261106
permissions:
  contents: read
concurrency:
  group: latest-mining-full-plan-wip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mining-full-plan:
    if: ${{ github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/plutolib-latest-mining-full-plan-ci-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record the exact full mining candidate plan without applying
        run: python3 pluto-lib/experiments/latest-mining-full-ci/run.py
