name: WIP native language and item-display contracts
on:
  push:
    branches:
      - checkpoint/plutolib-native-i18n-ci-20261106
permissions:
  contents: read
concurrency:
  group: native-i18n-wip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-i18n:
    if: ${{ github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/plutolib-native-i18n-ci-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify native language and item-name contracts
        run: python3 pluto-lib/experiments/native-i18n-ci/run.py
