name: WIP latest 41f chest owned-LOAD probe only
on:
  push:
    branches:
      - checkpoint/plutolib-latest-chest-probe-ci-20261106
permissions:
  contents: read
concurrency:
  group: latest-chest-probe-wip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chest-probe:
    if: ${{ github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/plutolib-latest-chest-probe-ci-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record the exact chest owned-LOAD probe without applying
        run: python3 pluto-lib/experiments/latest-chest-probe-ci/run.py
