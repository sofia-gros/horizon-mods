name: WIP Windows guarded default-feature link
on:
  push:
    branches: [checkpoint/windows-default-build-ci-20261107]
permissions:
  contents: read
concurrency:
  group: windows-default-build-only
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/windows-default-build-ci-20261107'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Fresh official preparation and ordinary guarded BuildOnly
        timeout-minutes: 115
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          & py -3.12 tconstruct/experiments/windows-build-only-ci/run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
