name: WIP latest isolated owned Guide storage
on:
  push:
    branches:
      - checkpoint/guide-latest-owned-opening-ci-20261106
permissions:
  contents: read
concurrency:
  group: guide-latest-owned-opening-wip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-guide-storage:
    if: ${{ github.repository == 'sofia-gros/horizon-mods' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/guide-latest-owned-opening-ci-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check isolated owned storage and actual BookScreen types
        run: python3 pluto-lib/experiments/guide-latest-owned-opening-ci/run.py
