name: Feature request
description: Suggest a feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Target mod
      options:
        - Tinkers' Construct
        - PlutoLib
        - Stellarsky
        - Classic Pipes
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should be added or changed?
      description: A clear description of the feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: Does the original have this?
      description: If the original Java mod already has this behaviour, describe it here. Parity with the original takes priority over new features.
  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      description: What problem does it solve, or what does it make better?
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been requested yet
          required: true
