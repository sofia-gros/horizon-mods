# Isolated experiment only: never included by package_native.py.
[[native.module]]
id = "state-api"
file = "crates/sunrise-client-render/src/chunk_map.rs"
name = "pluto_guide_lifetime_state"
source = "state.rs"
visibility = "pub"

[[native.module]]
id = "native-adapter"
file = "crates/sunrise-client/src/game/books.rs"
name = "pluto_guide_lifetime_experiment"
