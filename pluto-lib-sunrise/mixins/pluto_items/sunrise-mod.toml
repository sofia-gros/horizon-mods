id = "unknown"
name = "unknown"
version = "0.1.0"
api = "0.2"
side = "both"

[native]
game = "26.3"
sunrise = "3d34bbe63d71bb24c098c1e4021ef866be12fe2d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "adapter"
file = "crates/sunrise-client/src/game.rs"
name = "pluto_item_adapter"
source = "adapter.rs"

[[native.mixin]]
id = "use"
target = "sunrise_client::game::Game<'_>::use_tool"
kind = "HEAD"
cancellable = true
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&sunrise_client::items::ItemStack", value = "stack" },
]

[[native.mixin]]
id = "remote-use"
target = "sunrise_client::game::remote::item_has_use"
kind = "HEAD"
cancellable = true
helper = "remote.rs"
bindings = [{ name = "info", ty = "&sunrise_client::items::ItemInfo", value = "info" }]

[[native.mixin]]
id = "tooltip"
target = "sunrise_client::game::stations::Game<'_>::stack_tooltip"
kind = "RETURN"
helper = "tooltip.rs"
bindings = [
  { name = "value", ty = "Vec<(sunrise_client::text::Text, u32)>", value = "$value" },
  { name = "stack", ty = "&sunrise_client::items::ItemStack", value = "stack" },
]

[[native.mixin]]
id = "send-custom-data"
target = "sunrise_client::lan::hub::Hub::stack"
kind = "HEAD"
cancellable = true
helper = "network-host.rs"
bindings = [
  { name = "hub", ty = "&mut crate::lan::hub::Hub", value = "&mut *self" },
  { name = "source", ty = "&Option<ItemStack>", value = "s" },
]

[[native.mixin]]
id = "client-custom-data"
target = "sunrise_client::game::remote::Game<'_>::to_network"
kind = "HEAD"
cancellable = true
helper = "network-client.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "source", ty = "&Option<ItemStack>", value = "s" },
]
