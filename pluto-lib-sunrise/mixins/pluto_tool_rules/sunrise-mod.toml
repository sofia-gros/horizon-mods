id = "unknown"
name = "unknown"
version = "0.1.0"
api = "0.2"
side = "both"

[native]
game = "26.3"
sunrise = "3d34bbe63d71bb24c098c1e4021ef866be12fe2d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "api"
file = "crates/sunrise-items/src/items.rs"
name = "pluto_tool_rules"
source = "rules.rs"
visibility = "pub"
[[native.mixin]]
id = "speed"
target = "sunrise_items::items::Items::mining_speed"
kind = "RETURN"
helper = "speed.rs"
bindings = [
  { name = "value", ty = "f32", value = "$value" },
  { name = "items", ty = "&Items", value = "self" },
  { name = "held", ty = "Option<&ItemStack>", value = "held" },
  { name = "block", ty = "&str", value = "block" },
]
[[native.mixin]]
id = "drops"
target = "sunrise_items::items::Items::correct_for_drops"
kind = "RETURN"
helper = "drops.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "items", ty = "&Items", value = "self" },
  { name = "held", ty = "Option<&ItemStack>", value = "held" },
  { name = "block", ty = "&str", value = "block" },
]
