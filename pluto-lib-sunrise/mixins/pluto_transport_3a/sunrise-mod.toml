id = "unknown"
name = "unknown"
version = "0.1.0"
api = "0.2"
side = "both"

[native]
game = "26.3"
sunrise = "3d34bbe63d71bb24c098c1e4021ef866be12fe2d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "max-damage"
target = "sunrise_client_lib::lan::guest::stack_to_network"
kind = "RETURN"
helper = "max.rs"
bindings = [
  { name = "value", ty = "Option<Stack>", value = "$value" },
  { name = "source", ty = "&Option<ItemStack>", value = "s" },
]

[[native.module]]
id = "tool-codec"
file = "crates/sunrise-client/src/client_lib.rs"
name = "pluto_tool_codec"
source = "tool_codec.rs"
visibility = "pub"

[[native.mixin]]
id = "tool-encode"
target = "sunrise_client_lib::lan::guest::stack_to_network"
kind = "RETURN"
helper = "tool_encode.rs"
bindings = [
  { name = "value", ty = "Option<Stack>", value = "$value" },
  { name = "source", ty = "&Option<ItemStack>", value = "s" },
  { name = "registry", ty = "&impl Fn(&str, &str) -> Option<i32>", value = "&synced_id" },
]

[[native.mixin]]
id = "tool-decode"
target = "sunrise_client_lib::item_sync::from_network"
kind = "RETURN"
helper = "tool_decode.rs"
bindings = [
  { name = "value", ty = "ItemStack", value = "$value" },
  { name = "source", ty = "&Stack", value = "s" },
  { name = "builtin", ty = "&Builtin", value = "builtin" },
  { name = "synced", ty = "&Dynamic", value = "synced" },
]
