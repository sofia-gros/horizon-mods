id = "unknown"
name = "unknown"
version = "0.1.0"
api = "0.2"
side = "both"

[native]
game = "26.3"
sunrise = "3d34bbe63d71bb24c098c1e4021ef866be12fe2d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "page-core"
file = "crates/sunrise-client/src/creative.rs"
name = "pluto_paging"
source = "paging.rs"
visibility = "pub"

[[native.mixin]]
id = "prepare-pages"
target = "sunrise_client::game::Game<'_>::draw_creative"
kind = "HEAD"
helper = "prepare.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "draw-buttons"
target = "sunrise_client::game::Game<'_>::draw_creative"
kind = "RETURN"
helper = "draw.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut sunrise_client::hud::HudBatch", value = "&mut *batch" },
]

[[native.mixin]]
id = "click-buttons"
target = "sunrise_client::game::Game<'_>::click_creative"
kind = "HEAD"
cancellable = true
helper = "click.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
