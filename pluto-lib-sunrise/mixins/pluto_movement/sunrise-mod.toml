id = "unknown"
name = "unknown"
version = "0.1.0"
api = "0.2"
side = "both"

[native]
game = "26.3"
sunrise = "3d34bbe63d71bb24c098c1e4021ef866be12fe2d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Block movement factors for mod blocks (A34): the host's block declarations carry no speed-factor key, so the
# factors ride in PlutoLib's movement registry and this mixin applies them to the host's movement table when it loads.
[[native.module]]
id = "movement-apply"
file = "crates/sunrise-world/src/movement_properties.rs"
name = "pluto_movement"
source = "movement-apply.rs"
visibility = "pub"

# The factors are applied when the loaded table is bound for use: from_table refuses every post-processing
# seam (its body uses `?` and a closure), while bind is the funnel every load flows through before any
# movement value is read, and the only other reader of the unbound table reads its fall-distance
# reduction, which the factors never change. The bound states carry the same factors the patched
# definitions would have baked in, and a failed bind keeps the host's error untouched.
[[native.mixin]]
id = "movement-table"
target = "sunrise_world::movement_properties::MovementProperties<'_>::bind"
kind = "RETURN"
helper = "movement-table.rs"
bindings = [
  { name = "value", ty = "io::Result<BoundMovementProperties>", value = "$value" },
  { name = "properties", ty = "&MovementProperties<'_>", value = "&*self" },
]
