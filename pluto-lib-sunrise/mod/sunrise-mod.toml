# package: the shared inventory API crate, its client-library export, the
# component/stack views the item-predicate boundary uses, and the
# advancement event source/sink in the game module. The legacy package's
# remaining boundaries stayed native-preserved under the retained guards at
# that step. Owner decision, 2026-11-22: the crafting-match pair and the
# advancement drain/trigger/index attachments are composed at the end of
# this manifest under the reviewed bundle branches of the retained guards
# (bundle_attachments in crafting-match-boundaries.json and
