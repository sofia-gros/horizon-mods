# The throw sound: the game plays the vanilla snowball throw for every thrown type (Game::throw_item), where
# Java plays the type's own sound (tconstruct:throw.throwball / throw.shuriken, NEUTRAL, 0.5, pitch
# 0.4 / (random * 0.4 + 0.8)). The game's volume and pitch already are Java's, so only the event id is swapped:
# the store of `sound` in throw_item is replaced with the thrown type's registered throw sound, when it has one.
