id = "pluto-fishing-holds-rod-head"
target = "sunrise_client::game::fishing::Game<'_>::holds_rod"
kind = "HEAD"
cancellable = true
helper = "src/pluto-fishing-holds-rod-head.rs"
bindings = [
 { name = "game", ty = "&sunrise_client::game::Game<'_>", value = "&*self" }
]

[[native.mixin]]
id = "pluto-fishing-hit-head"
target = "sunrise_client::game::fishing::Hook::hit_entity"
kind = "HEAD"
helper = "src/pluto-fishing-hit-head.rs"
bindings = [
 { name = "hook", ty = "&mut sunrise_client::game::fishing::Hook", value = "&mut *self" },
 { name = "id", ty = "u32", value = "id" },
 { name = "deflects", ty = "bool", value = "deflects" }
]

