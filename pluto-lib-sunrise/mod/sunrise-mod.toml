id = "pluto_lib"
name = "PlutoLib"
version = "1.0.0"
api = "0.2"
side = "both"
license = "MIT"

[native]
game = "26.3"
sunrise = "ba1f24e4ad41246b558230aa665539dc768b1287"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# PlutoLib: Horizon's Fabric API. A trait mod (see docs/native-mods.md, "Trait mods"): the launcher links the
# [api] package into the game, and mods that declare "pluto_lib" in [dependencies] call its API.
[[native.mixin]]
id = "pluto-menu-actions-guest"
fingerprint = "4d08725cca384d881fca270334bbf89f45d95778ac3bf2beca2086db52ca8127"
target = "sunrise_client::game::lan_crafting::Game<'_>::lan_machine_click"
kind = "OVERWRITE"
helper = "src/pluto-menu-actions.rs"
bindings = []

# A content mod's menu type's equipment slots (a station window's armor and offhand) are
# declared in the menu type itself (data/<ns>/sunrise/menu/<name>.json: "slots" and
# "results"), the native rule — no weave joins them to a built menu. What remains woven
# below is the guest/remote side: every guest menu operation inserts them as it loads the
# guest's inventory in, before the operation runs (a guest's menu is stored and reused
# across operations, so insert_equipment leaves a menu that already carries its
# equipment alone). The remote
# client's wire mapping needs no menu object: pluto-menu-equipment-slot below already
# counts the equipment in.
[[native.module]]
id = "pluto-menu-equipment"
file = "crates/sunrise-client/src/menu.rs"
name = "pluto_menu_equipment"
source = "src/pluto-menu-equipment.rs"
visibility = "pub"

[[native.mixin]]
id = "pluto-menu-equipment-guest-load"
target = "sunrise_client::game::lan_crafting::load_player"
kind = "HEAD"
helper = "src/pluto-menu-equipment-guest-load.rs"
bindings = [{ name = "menu", ty = "&mut Menu", value = "&mut *menu" }]

[[native.mixin]]
id = "pluto-menu-equipment-slot"
target = "sunrise_client::game::native_menu_refs::Game<'_>::menu_slot"
kind = "HEAD"
cancellable = true
helper = "src/pluto-menu-equipment-slot.rs"
bindings = [{ name = "menu", ty = "&str", value = "menu" }, { name = "slot", ty = "i32", value = "slot" }]

