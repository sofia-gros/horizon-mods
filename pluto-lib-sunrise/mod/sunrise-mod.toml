# The stored map in a worn piece ticks while it is worn (Tinkers' minimap module): the head
# and return halves bracket the maps tick itself, so the swap is in place for the exploration
# sweep on the local player and on a LAN guest alike, and the offhand is restored before
# anything else runs. The return half hangs on the compass tick, not on the maps tick: the
# maps tick's own body refuses a RETURN seam, and the compass tick is the first call after
# it on both tick paths (the local player's equipment-compass pass opens with it, and a
