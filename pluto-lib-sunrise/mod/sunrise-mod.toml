# Fancy hanging entities: item frame and armor stand variants registered
# with PlutoLib's hanging registry run their variant behaviour over the
# host's vanilla frame/stand state (the variant rides in the entity's kept
# raw NBT). Unregistered items and entities keep the vanilla paths.
# The transport module hangs off client_lib.rs, the sunrise-client-lib
# crate root, not entry.rs: the from-NBT loader compiles in
# sunrise-client-lib, whose crate root has no `entry` module (entry and
# game exist only in the sunrise_client library crate). entity_nbt.rs
# itself cannot take a support module (its top-level glob re-exports make
# the weaver refuse with E_MODULE_CONFLICT), so the module sits at the
# shared root: crate::pluto_hanging_access in the client library, and
# sunrise_client_lib::pluto_hanging_access in the game crate through the
# library's glob re-export - one instance, reachable from both contexts.
[[native.module]]
id = "pluto-hanging-access"
file = "crates/sunrise-client/src/client_lib.rs"
name = "pluto_hanging_access"
source = "src/pluto-hanging-access.rs"
visibility = "pub"

