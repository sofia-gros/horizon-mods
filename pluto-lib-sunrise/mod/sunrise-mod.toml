# Retextured blocks: a block entity's texture on its model. The face's own
# tile layer is replaced with the texture block's particle layer, only on
# faces the pure table names as retextured slots. The swap rides the STORE
# of the `own` tile local (built from the second `face.layer as u16`
# occurrence): rewriting that expression in place fails
# E_UNSUPPORTED_CONTROL_FLOW in this closure-heavy body, while a variable
# store in the same body is a proven seam (the block tint above). A
# MODIFY_VARIABLE place is keyed by its variable (a selector on it is
# rejected with E_SELECTOR), so this entry hooks `own`, not the tint
# entry's `tint`. The first `face.layer as u16` occurrence feeds the
# connected-texture pick and stays on the model's own sprite.
[[native.mixin]]
id = "pluto-block-particle-tint"
target = "sunrise_client::game::block_particles::Game<'_>::particle_sprite"
kind = "MODIFY_VARIABLE"
variable = { name = "tint", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/pluto-block-particle-tint.rs"
bindings = [
    { name = "value", ty = "u32", value = "$value" },
    { name = "game", ty = "&Game<'_>", value = "&*self" },
    { name = "state", ty = "BlockStateId", value = "state" },
    { name = "pos", ty = "[i32; 3]", value = "pos" },
]

