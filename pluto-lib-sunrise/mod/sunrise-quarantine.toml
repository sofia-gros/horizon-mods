# The entity interaction finished: the same chestplate takeover runs when a click on an
# entity took nothing (Tinkers' InteractionHandler.afterEntityInteract, at its LOWEST
# priority, after the entity's own interaction ran). The module reports only clicks that
# arrived as an entity packet; the local player's click falls through to the hand's use,
# whose seam reports it instead. The provider and the cooldown hold are the hand seam's.
# The seam is a cancellable HEAD, not a RETURN: the interaction's body works through
# closures and `?`, which a RETURN cannot plan (E_UNSUPPORTED_CONTROL_FLOW). The HEAD
# runs the interaction itself under the module's guard (its nested call passes through
# to the vanilla body) and reports the outcome the interaction leaves, as the menu
# slot's wire mapping does for its body.
[[native.mixin]]
id = "pluto-entity-seat-player"
target = "sunrise_client::game::seats::Game<'_>::seat"
kind = "HEAD"
cancellable = true
helper = "src/pluto-entity-seat-player-head.rs"
bindings = [
 { name = "game", ty = "&Game<'_>", value = "self" },
 { name = "id", ty = "u32", value = "id" }
]

