# A piercing projectile's ignore list: the game's own list lives on the arrow (`pierced`), and a cancelled impact
# re-flies the arrow as it was before the tick, without the victim — so a callback that re-deals a piercing hit
# would meet the same entity again. The head on the native impact telling snapshots the list as the hit is told
# (the game adds the victim before it tells the hit), the API side carries it on the hit and records the victim a
# callback passes through, and the flight pass adds the record to the live arrow as the tick settles.
[[native.mixin]]
id = "pluto-throw-sound"
target = "sunrise_client::game::creatures::Game<'_>::throw_item"
kind = "MODIFY_VARIABLE"
variable = { name = "sound", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/pluto-throw-sound.rs"
bindings = [
 { name = "value", ty = "&'static str", value = "$value" },
 { name = "stack", ty = "&crate::items::ItemStack", value = "stack" }
]

