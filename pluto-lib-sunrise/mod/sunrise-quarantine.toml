# The enchanting table asks the stack for its enchantability: `enchantable_of` is the
# one lookup the table's offers, costs and selection all read, and a registered
# per-stack answer replaces its component/default lookup, as NeoForge's
# stack-sensitive `getEnchantmentValue(ItemStack)` replaces the default.
[[native.mixin]]
id = "pluto-item-enchantability"
target = "sunrise_items::enchant::Enchantments::enchantable_of"
kind = "HEAD"
cancellable = true
helper = "src/pluto-item-enchantability-head.rs"
bindings = [
 { name = "stack", ty = "&ItemStack", value = "stack" }
]

# A dropped stack a mod marks indestructible (the original's indestructible item
# entity) takes no environmental damage and never ages out: the item entity's
# environment tick is the one place every environmental hurt of a dropped stack
# flows through, so a registered true answer stills the tick and pins the age at
# the host's own unlimited-lifetime value.
[[native.mixin]]
id = "pluto-item-indestructible"
target = "sunrise_client::entities::ItemEntity::environment_tick"
kind = "HEAD"
cancellable = true
helper = "src/pluto-item-indestructible-head.rs"
bindings = [
 { name = "entity", ty = "&mut ItemEntity", value = "self" }
]

