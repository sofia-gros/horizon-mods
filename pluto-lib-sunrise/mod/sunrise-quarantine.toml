# The parse-order fix: a data load builds its content tables
# (build_world_tables, which parses the recipes) before it applies the
# mods' JSON reload listeners, so an ingredient of a mod's own kind was
# answered from mod data that had not loaded yet, its load-time item
# list came back empty, and the host dropped every recipe using one.
# Apply the listeners first at the two points that build a load's
# tables: a world opening and a reload. The host's own application
# later in each flow still runs; listener application replaces the
# loaded state wholesale, so it only refreshes the registry snapshots
