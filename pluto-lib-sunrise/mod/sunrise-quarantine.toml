# The hand's use finished: the chestplate takeover runs the worn sleeves module when the
# game did not consume the use (Tinkers' InteractionHandler, at its LOWEST priority). The
# takeover reads the acting player, their aim and their crouch state; the cooldown module
# carries the game's item cooldowns for the provider call. One injection per place.
# The seam is a cancellable HEAD, not a RETURN: the use's body works through
# closures and `?`, which a RETURN cannot plan (E_UNSUPPORTED_CONTROL_FLOW). The HEAD
