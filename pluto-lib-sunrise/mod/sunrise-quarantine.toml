target = "sunrise_client_lib::entities::ItemEntity::tick_move_before_block_effects"
kind = "MODIFY_EXPRESSION_VALUE"
selector = "vertical_collision_velocity(wanted.y, moved.y, ITEM_GRAVITY, self.on_ground, slime,)"
ordinal = 0
require = 1
helper = "src/pluto-item-after-fall.rs"
bindings = [
    { name = "value", ty = "f64", value = "$value" },
    { name = "item", ty = "&mut crate::entities::ItemEntity", value = "&mut *self" },
    { name = "world", ty = "&crate::world::World", value = "world" },
    { name = "collision", ty = "&sunrise_world::block_collision::BlockCollisionRegistry<'_>", value = "collision" },
    { name = "contact", ty = "Option<sunrise_core::position::BlockPos>", value = "contact" }
]

