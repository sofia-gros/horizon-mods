# Quarantined from sunrise-mod.toml during the Sunrise conversion.
# [[state]]/[[state.constructor]]: REFUSED by the Sunrise package reader
# (manifest.md @ 3d34bbe) - state must migrate to mod_api Attachments.
# [[crate]]: no Sunrise manifest equivalent - becomes a Cargo dependency
# of the native build. Kept verbatim for the migration work.
# Migration (L6, 2026-11-26): pluto-block-entity-client-state,
# pluto-block-entity-cache-generation and pluto-living-drop-state moved
# to module-owned static stores and were removed from this file.
# pluto-entity-spawn-state and pluto-advancement-tags remain: the
# pinned host exposes no move-stable per-instance identity for
# Navigation / ChunkMap (design blocker; see SUNRISE.md, L6 section).

[[state]]
id = "pluto-entity-spawn-state"
target = "sunrise_client_lib::mobs::nav::Navigation"
ty = "crate::mobs::nav::pluto_entity_spawn_state::SpawnState"
initial = "::core::default::Default::default()"

[[state.constructor]]
target = "sunrise_client_lib::mobs::nav::<Navigation as Default>::default"
selector = "Self"
require = 1

[[crate]]
id = "pluto-inventory-api"
path = "inventory-api"
dependent = "sunrise-client-lib"

[[state]]
id = "pluto-advancement-tags"
target = "sunrise_client_render::chunk_map::ChunkMap"
ty = "crate::chunk_map::pluto_advancement_tag_state::TagState"
initial = "::core::default::Default::default()"

[[state.constructor]]
target = "sunrise_client_render::chunk_map::<ChunkMap as Default>::default"
selector = "Self"
require = 1


