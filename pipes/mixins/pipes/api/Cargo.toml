[package]
name = "mod-pipes"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# The official launcher supplies PlutoLib from the bundle dependency.
[dependencies]
serde_json = "=1.0.154"
toml = "=0.8.23"
# Required loader metadata only; this mod uses PlutoLib, never Horizon APIs.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "441f49d57e344bd56b90fd4af5c4e443ff3937c9", default-features = false }
