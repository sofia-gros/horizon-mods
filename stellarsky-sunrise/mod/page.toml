# Stellarsky (Sunrise edition) — registry page. M1 prep DRAFT.
# Placement at execution: stellarsky-sunrise/mod/page.toml
# Screenshot placement:   stellarsky-sunrise/mod/page/stellarsky-night.png
#
# Schema (Sunrise modding book, "Publishing your mod" / cargo-sunrise-mod page
# checks):
# - summary >= 25 chars, description >= 125 chars (Unicode scalars after
#   trimming).
# - name / authors / homepage / issues default from sunrise-mod.toml; set here
#   to pin what the page shows. Page-only keys are exactly: summary,
#   description, categories, screenshots, name, authors, homepage, issues.
#   (The PlutoLib execution lane's check rejected `license` and `source` in
#   page.toml — do not add them here.)
# - categories omitted on purpose: IDs are maintainer-owned in the registry's
#   registry/categories.toml and must fit kind "native-mod"; a wrong ID fails
#   `cargo sunrise-mod check`.
# - SCREENSHOT IS PENDING: page/stellarsky-night.png does not exist yet. It is
#   captured in-game on the Sunrise client during the M5 smoke (one night
#   cycle: Milky Way with dark bands, twinkling stars, Sgr A* dimming,
#   vanilla stars suppressed) and must land before the page gate of
#   `cargo sunrise-mod check` can pass and before the release freezes the
#   page bundle. Per the plan, this capture is also the registry page
#   screenshot — a real Sunrise-client capture, not a Horizon one.
# - The dependency paragraph in the description is the owner's specified
#   wording, verbatim, in the same form as the Horizon v1.0.0 release notes
#   (plan §1.3). Page description text for the mods is lane-drafted pending
#   owner review (owner decision 2026-11-26 22:40).

summary = "Stellarsky: a real night sky — the pre-industrial sky with stars to about magnitude 7, the Milky Way with its dark bands, zodiacal light, airglow, and the black hole at Sagittarius A*, built on PlutoLib."

description = """
Stellarsky replaces the night sky with the real one: the sky as it was
before industrial light pollution, when stars were visible down to about
magnitude 6.5–7.0.

The bright end is drawn star by star — 523 stars of magnitude 4 and
brighter, each with its spectral colour and its own twinkling — because a
texture cannot twinkle and cannot darken what another layer drew. Over
the galactic centre sits the dark patch of Sagittarius A*, the black
hole at the heart of the Milky Way, and the vanilla star field is
replaced entirely. The faint end — stars of magnitude 4 to 7 and the
Milky Way with its dark bands — rides as textured layers, joined by the
zodiacal light and the airglow.

Every layer is registered through PlutoLib's public sky surface — the
mod injects nothing itself, on Sunrise exactly as on Horizon, and the
same source ships on both platforms. No resource pack is needed: the
sky textures are carried inside the mod itself.

PlutoLib v1.0.0以降が必要。v1.0.0向けに作成されました。新しいバージョンで動作しない場合は1.0.0を使用してください

This package is the Sunrise edition, built for Sunrise game 26.3. It
ships as source plus `Cargo.lock`; the launcher builds it on the
player's computer for the exact game build it pins.
"""

authors = ["sofia-gros"]
homepage = "https://github.com/sofia-gros/horizon-mods"
issues = "https://github.com/sofia-gros/horizon-mods/issues"

[[screenshots]]
path = "page/stellarsky-night.png"
caption = "PENDING — not yet captured. To be taken on the Sunrise client during the in-game smoke (one night cycle): the Milky Way with its dark bands, twinkling stars, the Sagittarius A* dark patch, and no vanilla stars."
